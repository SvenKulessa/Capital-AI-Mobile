name: Finance Scoring Security Preflight
on:
  push:
    branches: [capital-ai-mobile/scorer-migration-20261003]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  finance-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with: {persist-credentials: false, path: mobile}
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: SvenKulessa/Finance
          ref: dcef421fe6e350a3a2ade61d0299aad9ecca213c
          persist-credentials: false
          path: finance
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: finance/package-lock.json
      - name: Finance Dependencies installieren
        working-directory: finance
        run: npm ci --ignore-scripts
      - name: npm Advisory Evidence
        working-directory: finance
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > ../mobile/finance-npm-audit.json
          echo $? > ../mobile/finance-npm-audit-exit.txt
          npm ls --all --json > ../mobile/finance-production-graph.json
          echo $? > ../mobile/finance-production-graph-exit.txt
          exit 0
      - name: Finance Scoring Regression
        working-directory: finance
        run: npx vitest run tests/unit/scoringDispatcher.test.ts tests/unit/scoringModelRegistry.test.ts tests/unit/verifiedCryptoTechnicalScoring.test.ts tests/unit/scoringIntegrity.test.ts
      - name: Finance TypeScript
        working-directory: finance
        run: npx tsc --noEmit
      - name: Scoring Source Security Invariants
        working-directory: finance
        shell: bash
        run: |
          set -euo pipefail
          paths=(src/platform/Scoring/ScoringDispatcher.ts src/platform/Scoring/ScoringModelRegistry.ts src/platform/Scoring/contracts.ts src/services/verifiedCryptoTechnicalScoring.ts src/services/cryptoScoringService.ts src/services/scoringIntegrity.ts src/services/realMarketSignals.ts)
          ! grep -REn '\beval\s*\(|new Function\s*\(|child_process|execSync\(|spawn\(|nodemailer|multer' "${paths[@]}"
          ! grep -REn 'process\.env|import\.meta\.env|localStorage|sessionStorage|document\.cookie' "${paths[@]}"
          grep -Fq "scoreEligible: false" src/platform/Scoring/ScoringModelRegistry.ts
          grep -Fq "minimumCoverage: 0.5" src/services/verifiedCryptoTechnicalScoring.ts
      - name: Migration Advisory Gate
        working-directory: mobile
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('finance-npm-audit.json','utf8'));
          const v=report.metadata?.vulnerabilities;if(!v)throw new Error('audit evidence missing');
          if(Number(v.critical||0)>0)throw new Error('Finance has critical production advisory');
          const highs=Object.entries(report.vulnerabilities||{}).filter(([,x])=>x.severity==='high').map(([name])=>name);
          const unexpected=highs.filter(name=>name!=='nodemailer');
          if(unexpected.length)throw new Error('unexpected high advisory: '+unexpected.join(','));
          console.log(JSON.stringify({critical:v.critical,high:v.high,moderate:v.moderate,low:v.low,knownOutOfScopeHigh:highs,migrationRuntimeDependencies:[]},null,2));
          NODE
      - name: Trivy Finance Evidence
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: finance
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: json
          output: mobile/finance-trivy.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: finance-scoring-security-preflight
          retention-days: 14
          if-no-files-found: warn
          path: |
            mobile/finance-npm-audit.json
            mobile/finance-npm-audit-exit.txt
            mobile/finance-trivy.json
            mobile/finance-production-graph.json
            mobile/finance-production-graph-exit.txt
