name: Mobile Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: '24.18.0'
      - name: OSS Chromium mit festem SHA-256 bereitstellen
        run: ./scripts/setup-chromium.sh
      - name: Mobile Source Secret Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Mobile Unit Browser und Live Contract Gates
        run: ./scripts/quality.sh
      - name: Gate-Diagnose auch bei Fehler bereitstellen
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mobile-quality-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            evidence/quality-gates.txt
            evidence/unit-tests.txt
            evidence/live-contracts.log
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.13'
          cache-provider: basic
      - name: Android APK kompilieren
        run: gradle -p android --no-daemon :app:assembleDebug :app:assembleRelease :app:lintRelease
      - name: Artifact Hashes
        run: |
          mkdir -p evidence
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/release/app-release-unsigned.apk | tee evidence/SHA256SUMS.txt
          test -f evidence/browser-emulation.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capital-ai-mobile-apk
          retention-days: 14
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            evidence/SHA256SUMS.txt
            evidence/browser-emulation.html
