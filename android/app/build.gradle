plugins { id 'com.android.application' }
android {
  namespace 'de.svenkulessa.capitalai.mobile'
  compileSdk 36
  defaultConfig {
    applicationId "de.svenkulessa.capitalai.mobile"
    minSdk 26
    targetSdk 36
    versionCode 2
    versionName "0.2.0-mobile"
  }
  sourceSets { main { assets.srcDirs = ['../../web'] } }
  buildTypes {
    debug { debuggable false }
    release {
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
}
